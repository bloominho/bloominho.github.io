  - title: "Development of near-data computing solution targeting MoE LLMs"
    time: "June - Aug. 2024"
    position: "Undergraduate Research Assistant"
    place: "Seoul National University"
    sub_place: "CAPP Lab"
    subtitle: "Advisor: Prof. Hyukjae Lee"
    place_link: "http://capp.snu.ac.kr"
    explanation: "MoE models cannot be fully stored in GPU memory due to their large number of parameters, which leads to memory bottlenecks. To address this challenge, we developed MoNDE, a near-memory processing device. In this project, I was responsible for implementing MoNDE on an FPGA to demonstrate its performance. I also designed a protocol enabling concurrent processing and memory transfer between the FPGA device and the host, and successfully integrated it into our system. This new protocol resulted in a 1.9× speed improvement."
    github_y: "y"
    github_url: "https://github.com/bloominho/MoNDE"
    category: "project"

  - title: "Limitation of Optimization Targets on Loop Optimizers"
    time: "March - June 2024"
    position: "Undergraduate Thesis Student"
    place: "Yonsei University"
    sub_place: "Core Lab"
    subtitle: "Advisor: Prof. Hanjun Kim"
    place_link: "http://corelab.yonsei.ac.kr"
    explanation: "LLVM's polyhedral optimizer, Polly, had difficulty optimizing matrix multiplication codes with dynamically bounded loops. This was because when Polly optimized its outer structures first, the transformation of (inner) nested for loops hindered effective optimization of the inner loops. To address this issue, I redesigned Polly to optimize smaller for loops first before proceeding to larger ones. As a result, a 3.5× speed improvement was achieved."
    github_y: "n"
    category: "project"

